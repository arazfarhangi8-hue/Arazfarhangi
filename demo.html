<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اتاق آزمایشی مهر فرازان</title>
<style>
:root{--primary:#1479ff;--ink:#17324d;--muted:#607386;--line:#dbe7f1;--bg:#f7fbff}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 36px rgba(19,63,103,.1);padding:20px;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.btn,input{font:inherit;border-radius:10px;border:1px solid var(--line);padding:10px 13px}.btn{cursor:pointer;background:#fff}.primary{background:var(--primary);border-color:var(--primary);color:#fff}.room-code{font-size:24px;font-weight:900;letter-spacing:2px;direction:ltr}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.media{background:#0d1b2a;border-radius:16px;overflow:hidden;min-height:340px;display:grid;place-items:center}.media video{width:100%;height:100%;max-height:520px;object-fit:cover;background:#000}.status{padding:10px 12px;background:#f8fbfe;border:1px solid var(--line);border-radius:12px}.chat{height:320px;display:grid;grid-template-rows:auto 1fr auto;border:1px solid var(--line);border-radius:14px;overflow:hidden}.messages{padding:10px;overflow:auto;background:#fff}.msg{margin:5px 0;padding:7px 9px;background:#f3f8ff;border-radius:10px}.chat-send{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line)}.chat-send input{flex:1}.board{height:380px;border:1px solid var(--line);border-radius:14px;background:#fff;display:block;width:100%;touch-action:none}.help{font-size:13px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.media{min-height:260px}.board{height:320px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card top"><div><h1 style="margin:0">اتاق آزمایشی مهر فرازان 🎥</h1><div class="muted">اتصال آزمایشی گوشی ↔ کامپیوتر</div></div><a class="btn" href="./index.html">بازگشت</a></div>
<div class="card"><div class="row"><button id="createBtn" class="btn primary">ساخت اتاق در کامپیوتر</button><input id="roomInput" placeholder="کد اتاق را در گوشی وارد کنید" dir="ltr"><button id="joinBtn" class="btn">ورود گوشی</button></div><p id="myCode" class="room-code">—</p><div id="status" class="status">ابتدا یکی از دو گزینه را انتخاب کنید.</div><p class="help">روی کامپیوتر «ساخت اتاق» را بزن؛ کدی که نشان داده می‌شود را در گوشی وارد کن. سپس در گوشی دوربین و میکروفون را روشن کن.</p></div>
<div class="grid">
<div>
<div class="card"><h2>تصویر و صدا</h2><div class="media"><video id="remoteVideo" autoplay playsinline controls></video></div><div class="row" style="margin-top:10px"><button id="mediaBtn" class="btn primary">روشن کردن دوربین و میکروفون</button></div></div>
<div class="card"><h2>تختهٔ آزمایشی</h2><canvas id="board" class="board"></canvas><div class="row" style="margin-top:10px"><button id="clearBtn" class="btn">پاک کردن تخته</button><input id="color" type="color" value="#1479ff" title="رنگ قلم"></div></div>
</div>
<div>
<div class="card"><h2>پیام</h2><div class="chat"><div class="messages" id="messages"><div class="msg">اتاق آماده است.</div></div><div class="chat-send"><input id="chatInput" placeholder="پیام خود را بنویسید…"><button id="sendBtn" class="btn primary">ارسال</button></div></div></div>
<div class="card"><h2>وضعیت اتصال</h2><div class="status" id="connectionState">قطع</div></div>
</div>
</div>
</div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="demo.js"></script>
</body></html>
